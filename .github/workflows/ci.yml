name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
        with: { path: camada-ruby-example }
      # camada is a path gem on the sibling checkout; the SDK vendors its own beacon build.
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-ruby, path: camada-ruby }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: camada-ruby-example
      - run: bundle exec rubocop && bundle exec rspec
        working-directory: camada-ruby-example
